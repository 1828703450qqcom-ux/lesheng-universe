<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">乐生宇宙 · LESHENG UNIVERSE</title>
  <desc id="desc">Turn your story into a music character. Meet through music. A midnight-blue constellation with a record-shaped planet and an original illustrated character.</desc>
  <defs>
    <radialGradient id="sky"><stop stop-color="#16394d"/><stop offset="1" stop-color="#070e21"/></radialGradient>
    <linearGradient id="record"><stop stop-color="#132845"/><stop offset="1" stop-color="#263966"/></linearGradient>
    <pattern id="stars" width="140" height="110" patternUnits="userSpaceOnUse"><circle cx="18" cy="22" r="1" fill="#8ca9c9"/><circle cx="100" cy="81" r="1.2" fill="#8ca9c9"/><circle cx="126" cy="31" r=".8" fill="#8ca9c9"/></pattern>
  </defs>
  <rect width="1280" height="640" rx="24" fill="url(#sky)"/>
  <rect width="1280" height="640" rx="24" fill="url(#stars)" opacity=".48"/>
  <g fill="none" stroke="#7597ba" stroke-opacity=".38"><path d="M755 89 845 54 928 115 1026 85 1100 178 1198 145"/><ellipse cx="976" cy="342" rx="218" ry="213"/><ellipse cx="976" cy="342" rx="244" ry="103" transform="rotate(-26 976 342)" stroke="#f2d092" stroke-opacity=".6"/><circle cx="976" cy="342" r="179" stroke-dasharray="3 9"/></g>
