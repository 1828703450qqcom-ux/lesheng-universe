    <text x="68" y="218" fill="#fff4d9" font-size="70" letter-spacing="5">乐生宇宙</text>
    <text x="72" y="267" fill="#8fa9be" font-size="21" letter-spacing="6">LESHENG UNIVERSE</text>
    <text x="72" y="355" fill="#f5d690" font-size="30">让一首歌，成为认识一个人的开始。</text>
    <text x="72" y="410" fill="#b8c9d8" font-size="19">你的故事 → 你的角色 → 你的音乐同路人</text>
    <text x="72" y="501" fill="#8fa9be" font-size="15">React · Express · MediaPipe · Three.js</text>
    <text x="72" y="560" fill="#7894ad" font-size="13" letter-spacing="2">LOCAL CHARACTER ENGINE / NO PAID AI API REQUIRED</text>
  </g>
