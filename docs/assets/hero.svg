  <g fill="none" stroke="#8aaac9" opacity=".16"><circle cx="976" cy="342" r="128"/><circle cx="976" cy="342" r="117"/><circle cx="976" cy="342" r="106"/><circle cx="976" cy="342" r="95"/></g>
